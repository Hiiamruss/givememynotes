<!DOCTYPE html>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script> 
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
    body {
        font-family: "Poppins", sans-serif;
        background-color:lightblue;
    }

    .card {
        width:500px;
        height:300px;
        border-radius:15px;
        background-color:black;
        color:white;
        padding:10px;
    }

    button {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:none;
        cursor:pointer;
    }

    input {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:black 1px solid;
        cursor:pointer;
    }

    div {
        width:400px;
        border-radius:15px;
        background-color:coral;
        padding:10px;
        margin-top:20px;
    }
</style>
<html>
    <head>
        <title>Chat</title>
    </head>
    <body>
        <center>
            <h1>Give me My Notes</h1>
            <b id="code">Ask Guru</b>

            <section>
            <input id="message" type="text" placeholder="Put question here">
            </section>
            <section>
                <button onclick="AskGuru()" id="button">Ask Guru</button>
            </section>

            <section id="messages">

            </section>
            <section><a href="index.html"><button>Notes Maker</button></a>
            <a href="chapelnotesmaker.html"><button>Chapel Note Maker</button></a>
            <a href="essaymaker.html"><button>Essay Maker</button></a>
            <a href="https://humanizeai.pro"><button>Free AI Humanizer</button></a></section>
        </center>
    </body>
</html>
<script>
    function AskGuru() {
        document.getElementById("button").disabled=true;
        const question = document.getElementById("message").value;
        fetch("https://available-via-baby-percent.trycloudflare.com/api/guru", {
            method: "POST",
            headers: {
                "content-type": "application/json",
            },
            body: JSON.stringify({
                message: question,
            })
        }).then(response => response.json())
        .then(data => {
            const div = document.createElement("div");
            const b = document.createElement("b");
            const p = document.createElement("p");

            b.innerText = "Guru";
            p.innerText = data.reply;

            div.appendChild(b);
            div.appendChild(p);

            document.getElementById("messages").prepend(div);
        })
    }
</script>
