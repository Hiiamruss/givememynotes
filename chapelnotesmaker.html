<!DOCTYPE html>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script> 
<style>
    .card {
        width:1000px;
        background-color:lightblue;
        border-radius:15px;
        padding:20px;
    }

    textarea {
        width: 500px;
        height: 200px;
        border-radius:15px;
    }

    .output {
        width: 500px;
        border-radius:15px;
        background-color:white;
    }

    button {
        width:250px;
        height:35px;
        border-radius: 15px;
        margin-top:10px;
        border:none;
        cursor:pointer;
    }

</style>
<html>
    <head>
        <title>Give Me My Notes</title>
    </head>
    <body>
        <center>
            <section class="card">
                <h1>Give Me My Notes 📝</h1>
                <p>Chapel Notes Maker</p>
                <textarea id="references">This is a place where you can put all the sermon reflection questions.</textarea>
                <section style="margin-bottom:20px;">
                    <button onclick="AskAI()">Generate Notes</button>
                </section>
                <section class="output">
                    <h1>Your reflection will show up here!</h1>
                    <p id="output"></p>
                </section>
            </section>
            <h1>About Chapel Notes Maker</h1>
            <p>Chapel Notes maker uses the latest official rubric from IICS.</p>
            <h1>View Other Tools 🛠️</h1>
            <a href="index.html"><button>Notes Maker</button></a>
            <a href="chapelnotesmaker.html"><button>Chapel Note Maker</button></a>
            <a href="essaymaker.html"><button>Essay Maker</button></a>
            <a href="https://humanizeai.pro"><button>Free AI Humanizer</button></a>
            
        </center>
    </body>
</html>
<script>
        const firebaseConfig = {
        apiKey: "AIzaSyCa5IXdhKAWd9xb_pdWpdTGWnwyTHz1aNM",
        authDomain: "apikeys-9c946.firebaseapp.com",
        databaseURL: "https://apikeys-9c946-default-rtdb.firebaseio.com",
        projectId: "apikeys-9c946",
        storageBucket: "apikeys-9c946.firebasestorage.app",
        messagingSenderId: "226994260057",
        appId: "1:226994260057:web:35c3ed5b52cca047b2c948"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const link = db.ref("link");
    let data;

    link.on("value", snap => {
        data = snap.val();
    });

    function AskAI() {
        fetch(data + "api/chapelnotes", {
                method: "POST",
                headers: {
                    "content-type": "application/json",
                },
                body: JSON.stringify({
                    message: document.getElementById("references").value
                })
            }).then(response => response.json())
            .then(data => {
                if (data.reply == "error: not enough context") {
                    alert("Please give more context for the prompt you need to ask. ")
                    return;
                }
                document.getElementById("output").innerText = data.reply;
            });
    }
</script>
